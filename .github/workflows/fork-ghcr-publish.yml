name: Publish Fork GHCR Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional extra image tag (in addition to latest + commit SHA)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-ghcr-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            dl-cdn.alpinelinux.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read transport version
        id: version
        run: |
          VERSION=$(tr -d '\n\r' < transports/version)
          if [ -z "$VERSION" ]; then
            echo "::error::transports/version is empty"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Determine GHCR image and tags
        id: meta
        env:
          EXTRA_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail

          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/${REPO_LC}"

          EXTRA_TAG_VALUE="${EXTRA_TAG:-}"

          if [ -n "${EXTRA_TAG_VALUE}" ]; then
            if [[ ! "${EXTRA_TAG_VALUE}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "::error::Invalid image_tag '${EXTRA_TAG_VALUE}'. Use 1-128 chars: [A-Za-z0-9._-], first char [A-Za-z0-9_]"
              exit 1
            fi

            if [ "${EXTRA_TAG_VALUE}" = "latest" ] || [ "${EXTRA_TAG_VALUE}" = "${GITHUB_SHA}" ]; then
              echo "::warning::image_tag '${EXTRA_TAG_VALUE}' duplicates a default tag; ignoring it"
              EXTRA_TAG_VALUE=""
            fi
          fi

          {
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${GITHUB_SHA}"
            if [ -n "${EXTRA_TAG_VALUE}" ]; then
              echo "${IMAGE}:${EXTRA_TAG_VALUE}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push GHCR image
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: ./transports/Dockerfile.local
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=fork-ghcr-publish
          cache-to: type=gha,mode=max,scope=fork-ghcr-publish
